# Temporary: which macOS runner labels actually PICK UP a job on this account?
# macos-13 has queued for 24h and been auto-cancelled on every previous release
# run, so the macOS bundle has never once been built. A label that does not exist
# does not error — it queues silently, which is indistinguishable from "busy".
name: probe-runners
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-15-intel, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m
